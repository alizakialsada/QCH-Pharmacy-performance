name: Update Pharmacy Data
on:
  workflow_dispatch:
  push:
    paths: ["incoming/**", "scripts/**", "config/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas openpyxl pypdf rapidfuzz
      - run: python scripts/build_data.py
