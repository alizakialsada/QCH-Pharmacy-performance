name: Update Pharmacy Intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * *'   # 06:30 Saudi time - daily Wasfaty / Inventory refresh
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Fetch Excel attachments from Gmail (optional)
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_QUERY: ${{ vars.GMAIL_QUERY }}
        run: python scripts/fetch_gmail.py
      - name: Update dashboard data
        env:
          INVENTORY_EXPORT_URL: ${{ vars.INVENTORY_EXPORT_URL }}
        run: python scripts/update_dashboard.py
      - name: Commit refreshed data
        run: |
          git config user.name "pharmacy-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ incoming/
          git diff --cached --quiet || git commit -m "Update pharmacy intelligence data"
          git push
