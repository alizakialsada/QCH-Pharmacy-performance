</style></head><body class="locked"><div class="login-gate" id="loginGate"><div class="login-panel"><div class="login-logo"></div><h2>Pharmacy Intelligence</h2><p>Authorized access only</p><input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">Enter</button><div class="login-error" id="loginError"></div></div></div><div class="shell"><div class="top"><div class="brand"><div class="mark"></div><div><h1>Pharmacy Intelligence</h1><div class="sub">Performance · STAT · Hold · Wasfaty · Inventory</div><div class="fresh" id="freshness"></div></div></div><div class="rightnote">Aug 2025 — Aug 2026</div></div><div class="nav" id="nav"><button data-tab="kpi">KPI</button><button data-tab="overview" class="active">Overview</button><button data-tab="staff">Staff</button><button data-tab="stat">STAT</button><button data-tab="hold">Hold</button><button data-tab="wasfaty">Wasfaty</button></div><div class="controls"><div class="scope" id="scope"><button data-h="BOTH" class="active">Both</button><button data-h="QCH">QCH</button><button data-h="PMFH">PMFH</button></div><div class="months" id="months"></div><div class="searchrow"><input id="search" class="search" placeholder="Search"><button class="btn" id="export">Export Excel</button></div></div><div id="app"></div><div class="footer"><span class="creator-credit">Created by Automation Supervisor Ali Alsada</span></div></div><div class="drawer" id="drawer"></div>
<script src="data/platform-data.js"></script><script>const DATA=window.PLATFORM_DATA;let tab='overview',hospital='BOTH',month='ALL',query='';const M=DATA.months,$=s=>document.querySelector(s),nf=n=>Number(n||0).toLocaleString(),pc=n=>(Number(n||0)).toFixed(1)+'%';function hs(){return hospital==='BOTH'?['QCH','PMFH']:[hospital]}function sum(a,k){return a.reduce((s,x)=>s+(Number(x[k])||0),0)}function ms(){return month==='ALL'?M:[month]}

// Display aliases and fuzzy staff search
for (const h of ['QCH','PMFH']) {
  for (const m of DATA.months) {
    const d=DATA.dispensing?.[h]?.[m];
    if(d?.employees) for(const e of d.employees){
      if((e.key||'').toUpperCase()==='ALI ZAKI IBRAHIM ALSADA') e.name='ALI ZAKI ALSADA';
    }
    const st=DATA.stat?.[h]?.[m];
    if(st?.employees) for(const e of st.employees){
      if((e.key||'').toUpperCase()==='ALI ZAKI IBRAHIM ALSADA') e.name='ALI ZAKI ALSADA';
    }
  }
}
function normtxt(x){return String(x||'').toUpperCase().replace(/[^A-Z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}
function smartmatch(text,q){let T=normtxt(text),Q=normtxt(q);if(!Q)return true;return Q.split(' ').filter(Boolean).every(tok=>T.includes(tok))}
function aggD(h){let em=new Map(),S={patients:0,orders:0,dispensed:0,not_dispensed:0};for(const m of ms()){let d=DATA.dispensing[h][m];for(const k in S)S[k]+=d.summary[k]||0;for(const e of d.employees){let a=em.get(e.key)||{key:e.key,name:e.name,patients:0,orders:0,dispensed:0,not_dispensed:0,sm:new Map()};a.patients+=e.patients;a.orders+=e.orders;a.dispensed+=e.dispensed;a.not_dispensed+=e.not_dispensed;for(const x of e.stores)a.sm.set(x.store,(a.sm.get(x.store)||0)+x.orders);em.set(e.key,a)}}S.completion=S.orders?100*S.dispensed/S.orders:0;let arr=[...em.values()],mx=Math.max(1,...arr.map(x=>x.orders));for(const e of arr){e.completion=e.orders?100*e.dispensed/e.orders:0;e.workload_index=100*e.orders/mx;e.performance_index=.6*e.completion+.4*e.workload_index;e.stores=[...e.sm].sort((a,b)=>b[1]-a[1]).map(([store,orders])=>({store,orders,share:100*orders/e.orders}))}arr.sort((a,b)=>b.performance_index-a.performance_index||b.orders-a.orders);return{summary:S,employees:arr}}
function aggS(h){let em=new Map(),S={orders:0,within:0,over:0};for(const m of ms()){let d=DATA.stat[h][m];S.orders+=d.summary.orders;S.within+=d.summary.within;S.over+=d.summary.over;for(const e of d.employees){let a=em.get(e.key)||{key:e.key,name:e.name,orders:0,within:0,over:0,avgw:0,meds:[],sm:new Map()};a.orders+=e.orders;a.within+=e.within;a.over+=e.over;a.avgw+=e.avg*e.orders;a.meds.push([e.median,e.orders]);for(const x of e.stores)a.sm.set(x.store,(a.sm.get(x.store)||0)+x.orders);em.set(e.key,a)}}S.compliance=S.orders?100*S.within/S.orders:0;let arr=[...em.values()].map(e=>({...e,compliance:e.orders?100*e.within/e.orders:0,avg:e.orders?e.avgw/e.orders:0,median:wmed(e.meds),stores:[...e.sm].sort((a,b)=>b[1]-a[1]).map(([store,orders])=>({store,orders,share:100*orders/e.orders}))}));return{summary:S,employees:arr}}
function wmed(a){if(!a.length)return 0;let t=a.reduce((s,x)=>s+x[1],0),c=0;for(const x of a.sort((p,q)=>p[0]-q[0])){c+=x[1];if(c>=t/2)return x[0]}return 0}
function aggH(h){let holds=0,ec=new Map(),rc=new Map();for(const m of ms()){let d=DATA.hold[h][m];holds+=d.holds;for(const x of d.employees){let a=ec.get(x.key)||{key:x.key,name:x.name,holds:0};a.holds+=x.holds;ec.set(x.key,a)}for(const x of d.reasons)rc.set(x.reason,(rc.get(x.reason)||0)+x.count)}return{holds,employees:[...ec.values()].sort((a,b)=>b.holds-a.holds),reasons:[...rc].map(([reason,count])=>({reason,count})).sort((a,b)=>b.count-a.count)}}
function aggW(h){let x={items:0,prescriptions:0,patients:0,per1000:0};for(const m of ms()){let d=DATA.wasfaty[h][m];x.items+=d.items;x.prescriptions+=d.prescriptions;x.patients+=d.patients}let o=aggD(h).summary.orders;x.per1000=o?1000*x.items/o:0;return x}
function k(l,v,m=''){return`<div class="card kpi"><div class="klabel">${l}</div><div class="kvalue">${v}</div>${m?`<div class="kmini">${m}</div>`:''}</div>`}function cls(v){return v>=90?'good':v>=75?'warn':'bad'}function mix(e){return`<div class="mix">${e.stores.slice(0,5).map(s=>`<span class="storetag">${s.store} <b>${s.share.toFixed(0)}%</b></span>`).join('')}${e.stores.length>5?`<span class="storetag">+${e.stores.length-5}</span>`:''}</div>`}function filt(a){let q=($('#search')?.value||'').trim();if(!q)return a;return a.filter(x=>smartmatch([x.name,x.key,x.hospital,(x.stores||[]).map(z=>z.store).join(' ')].join(' '),q))}
function overview(){let ds=hs().map(aggD),ss=hs().map(aggS),o=sum(ds.map(x=>x.summary),'orders'),d=sum(ds.map(x=>x.summary),'dispensed'),so=sum(ss.map(x=>x.summary),'orders'),sw=sum(ss.map(x=>x.summary),'within'),dc=o?100*d/o:0,sc=so?100*sw/so:0,idx=(dc+sc)/2,holds=hs().reduce((a,h)=>a+aggH(h).holds,0);return`<div class="grid">${k('Compliance Index',pc(idx))}${k('Dispensing',pc(dc),nf(o)+' orders')}${k('STAT ≤ 30 min',pc(sc),nf(so)+' orders')}${k('Hold',nf(holds))}<div class="card full section"><div class="sectop"><div class="sectitle">Hospital Snapshot</div></div><div class="tablebox"><table id="overviewTable"><thead><tr><th>Hospital</th><th class="num">Patients</th><th class="num">Orders</th><th class="num">Dispensing</th><th class="num">STAT</th><th class="num">Hold</th><th class="num">Wasfaty</th></tr></thead><tbody>${hs().map(h=>{let d=aggD(h).summary,s=aggS(h).summary,ho=aggH(h),w=aggW(h);return`<tr><td class="name">${h}</td><td class="num">${nf(d.patients)}</td><td class="num">${nf(d.orders)}</td><td class="num ${cls(d.completion)}">${pc(d.completion)}</td><td class="num ${cls(s.compliance)}">${pc(s.compliance)}</td><td class="num">${nf(ho.holds)}</td><td class="num">${nf(w.items)}</td></tr>`}).join('')}</tbody></table></div></div></div>`}
function staff(){let a=[];for(const h of hs())for(const e of aggD(h).employees)a.push({...e,hospital:h});a=filt(a.sort((x,y)=>y.performance_index-x.performance_index||y.orders-x.orders));return`<div class="grid"><div class="card full section"><div class="sectop"><div><div class="sectitle">Staff Performance</div><div class="quiet">${a.length} employees · click a name for pharmacy distribution</div></div></div><div class="tablebox"><table id="staffTable"><thead><tr><th>#</th><th>Employee</th><th>Hospital</th><th>Pharmacy Mix</th><th class="num">Patients</th><th class="num">Orders</th><th class="num">Dispensed</th><th class="num">Completion</th><th class="num">Index</th></tr></thead><tbody>${a.map((e,i)=>`<tr onclick="openEmp('${esc(e.key)}','${e.hospital}')" style="cursor:pointer"><td class="rank">${i+1}</td><td class="name">${e.name}</td><td><span class="pill"><i class="dot"></i>${e.hospital}</span></td><td>${mix(e)}</td><td class="num">${nf(e.patients)}</td><td class="num">${nf(e.orders)}</td><td class="num">${nf(e.dispensed)}</td><td class="num ${cls(e.completion)}">${pc(e.completion)}</td><td class="num score ${cls(e.performance_index)}">${e.performance_index.toFixed(1)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function statv(){let a=[];for(const h of hs())for(const e of aggS(h).employees)a.push({...e,hospital:h});a=filt(a.sort((x,y)=>y.orders-x.orders));let q=hs().map(aggS).map(x=>x.summary),o=sum(q,'orders'),w=sum(q,'within'),c=o?100*w/o:0;return`<div class="grid">${k('STAT Compliance',pc(c))}${k('STAT Orders',nf(o))}${k('≤ 30 min',nf(w))}${k('> 30 min',nf(o-w))}<div class="card full section"><div class="tablebox"><table id="statTable"><thead><tr><th>Employee</th><th>Hospital</th><th>Pharmacy Mix</th><th class="num">Orders</th><th class="num">≤30</th><th class="num">>30</th><th class="num">Compliance</th><th class="num">Avg min</th><th class="num">Median min</th></tr></thead><tbody>${a.map(e=>`<tr><td class="name">${e.name}</td><td>${e.hospital}</td><td>${mix(e)}</td><td class="num">${nf(e.orders)}</td><td class="num">${nf(e.within)}</td><td class="num">${nf(e.over)}</td><td class="num ${cls(e.compliance)}">${pc(e.compliance)}</td><td class="num">${e.avg.toFixed(1)}</td><td class="num">${e.median.toFixed(1)}</td></tr>`).join('')}</tbody></table></div></div></div>`}
function holdv(){let a=[],r=new Map(),t=0;for(const h of hs()){let x=aggH(h);t+=x.holds;for(const e of x.employees)a.push({...e,hospital:h});for(const z of x.reasons)r.set(z.reason,(r.get(z.reason)||0)+z.count)}a=filt(a.sort((x,y)=>y.holds-x.holds));let rr=[...r].map(([reason,count])=>({reason,count})).sort((a,b)=>b.count-a.count);return`<div class="grid">${k('Holds',nf(t))}${k('Top Reason',rr[0]?.reason||'—',rr[0]?nf(rr[0].count):'')}${k('Employees',nf(a.length))}${k('Review',nf(ms().reduce((z,m)=>z+DATA.hold.Review[m].holds,0)))}<div class="card wide section"><div class="tablebox"><table id="holdTable"><thead><tr><th>Employee</th><th>Hospital</th><th class="num">Holds</th></tr></thead><tbody>${a.map(e=>`<tr><td class="name">${e.name}</td><td>${e.hospital}</td><td class="num">${nf(e.holds)}</td></tr>`).join('')}</tbody></table></div></div><div class="card side section">${rr.slice(0,12).map(x=>`<div class="splitrow"><strong>${x.reason}</strong><span>${nf(x.count)}</span></div>`).join('')}</div></div>`}
function wasfv(){let a=hs().map(h=>({hospital:h,...aggW(h)})),it=sum(a,'items'),rx=sum(a,'prescriptions'),p=sum(a,'patients'),o=hs().reduce((z,h)=>z+aggD(h).summary.orders,0),rate=o?1000*it/o:0;let inv={despite:0,due:0,matched:0,unmatched:0,ready:false};for(const h of hs())for(const m of ms()){let w=DATA.wasfaty[h][m];if(w.despite_availability!=null){inv.ready=true;inv.despite+=Number(w.despite_availability)||0;inv.due+=Number(w.due_to_unavailability)||0;inv.matched+=Number(w.inventory_matched_items)||0;inv.unmatched+=Number(w.inventory_unmatched_items)||0}}let invCards=inv.ready?`${k('Despite Availability',nf(inv.despite))}${k('Due to Unavailability',nf(inv.due))}${k('Inventory Matched',nf(inv.matched))}${k('Unmatched',nf(inv.unmatched))}`:`<div class="card full section"><div class="inventory-note"><strong>Inventory Intelligence link is ready.</strong> The first daily inventory snapshot will activate Wasfaty Despite Availability automatically.</div></div>`;return`<div class="grid">${k('Written Items',nf(it))}${k('Prescriptions',nf(rx))}${k('Patients',nf(p))}${k('/ 1,000 Orders',rate.toFixed(1))}${invCards}<div class="card full section"><div class="tablebox"><table id="wasfatyTable"><thead><tr><th>Hospital</th><th class="num">Written Items</th><th class="num">Prescriptions</th><th class="num">Patients</th><th class="num">/1,000 Orders</th></tr></thead><tbody>${a.map(x=>`<tr><td class="name">${x.hospital}</td><td class="num">${nf(x.items)}</td><td class="num">${nf(x.prescriptions)}</td><td class="num">${nf(x.patients)}</td><td class="num">${x.per1000.toFixed(1)}</td></tr>`).join('')}</tbody></table></div></div></div>`}

function monthlySeries(){let months=M,rows=[];for(const m of months){let H=hs(),do_=0,dd=0,so=0,sw=0,holds=0,witems=0,patients=0;for(const h of H){let d=DATA.dispensing[h][m].summary,s=DATA.stat[h][m].summary;do_+=d.orders||0;dd+=d.dispensed||0;patients+=d.patients||0;so+=s.orders||0;sw+=s.within||0;holds+=DATA.hold[h][m].holds||0;witems+=DATA.wasfaty[h][m].items||0}let disp=do_?100*dd/do_:0,stat=so?100*sw/so:0,index=(disp+stat)/2;rows.push({month:m,orders:do_,patients,disp,stat,index,holds,wasfaty:witems})}return rows}
function svgLine(hostId,rows,series){let el=document.getElementById(hostId);if(!el)return;let W=720,H=220,p={l:38,r:14,t:14,b:34},iw=W-p.l-p.r,ih=H-p.t-p.b,n=Math.max(1,rows.length-1),ymin=0,ymax=100;let x=i=>p.l+(rows.length===1?iw/2:iw*i/n),y=v=>p.t+ih-(v-ymin)/(ymax-ymin)*ih;let grid=[0,25,50,75,100].map(v=>`<line class="chart-grid" x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}"/><text class="chart-axis" x="${p.l-8}" y="${y(v)+3}" text-anchor="end">${v}%</text>`).join('');let labels=rows.map((r,i)=>`<text class="chart-axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${new Date(r.month+'-01').toLocaleString('en',{month:'short'})}</text>`).join('');let paths=series.map(s=>{let pts=rows.map((r,i)=>`${x(i)},${y(r[s.key]||0)}`).join(' ');let dots=rows.map((r,i)=>`<circle class="${s.dot}" cx="${x(i)}" cy="${y(r[s.key]||0)}" r="3"><title>${r.month}: ${(r[s.key]||0).toFixed(1)}%</title></circle>`).join('');return`<polyline class="${s.cls}" points="${pts}"/>${dots}`}).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${paths}${labels}</svg>`}
function svgBars(hostId,rows,key,cls,fmt='n'){let el=document.getElementById(hostId);if(!el)return;let W=720,H=220,p={l:42,r:14,t:14,b:34},iw=W-p.l-p.r,ih=H-p.t-p.b,max=Math.max(1,...rows.map(r=>r[key]||0)),bw=Math.max(8,iw/Math.max(1,rows.length)*.58);let x=i=>p.l+iw*(i+.5)/Math.max(1,rows.length),y=v=>p.t+ih-(v/max)*ih;let grid=[0,.25,.5,.75,1].map(q=>{let v=max*q;return`<line class="chart-grid" x1="${p.l}" y1="${y(v)}" x2="${W-p.r}" y2="${y(v)}"/><text class="chart-axis" x="${p.l-7}" y="${y(v)+3}" text-anchor="end">${fmt==='n'?nf(Math.round(v)):v.toFixed(0)}</text>`}).join('');let bars=rows.map((r,i)=>`<rect class="${cls}" x="${x(i)-bw/2}" y="${y(r[key]||0)}" width="${bw}" height="${p.t+ih-y(r[key]||0)}" rx="4"><title>${r.month}: ${nf(r[key]||0)}</title></rect><text class="chart-axis" x="${x(i)}" y="${H-10}" text-anchor="middle">${new Date(r.month+'-01').toLocaleString('en',{month:'short'})}</text>`).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}</svg>`}
function renderRankBars(){let el=document.getElementById('staffRankBars');if(!el)return;let a=[];for(const h of hs())for(const e of aggD(h).employees)a.push({...e,hospital:h});a.sort((x,y)=>y.performance_index-x.performance_index||y.orders-x.orders);let max=Math.max(1,...a.map(x=>x.performance_index));el.innerHTML=a.map((e,i)=>`<div class="rankbar-row" title="${e.hospital} · ${nf(e.orders)} orders"><div class="rankbar-name">${i+1}. ${e.name}</div><div class="rankbar-track"><div class="rankbar-fill" style="width:${Math.max(1,e.performance_index/max*100).toFixed(1)}%"></div></div><div class="rankbar-val">${e.performance_index.toFixed(1)}</div></div>`).join('')}
function kpi(){let r=monthlySeries(),latest=(month==='ALL'?r[r.length-1]:r.find(x=>x.month===month))||r[r.length-1]||{index:0,disp:0,stat:0,orders:0,holds:0,wasfaty:0};let table=`<table id="kpiTable"><thead><tr><th>Month</th><th>Orders</th><th>Dispensing %</th><th>STAT %</th><th>Index</th><th>Hold</th><th>Wasfaty</th></tr></thead><tbody>${r.map(x=>`<tr><td>${x.month}</td><td>${x.orders}</td><td>${x.disp.toFixed(1)}</td><td>${x.stat.toFixed(1)}</td><td>${x.index.toFixed(1)}</td><td>${x.holds}</td><td>${x.wasfaty}</td></tr>`).join('')}</tbody></table>`;setTimeout(()=>{svgLine('perfTrend',r,[{key:'disp',cls:'line-disp',dot:'dot-disp'},{key:'stat',cls:'line-stat',dot:'dot-stat'},{key:'index',cls:'line-index',dot:'dot-index'}]);svgBars('volumeTrend',r,'orders','bar-volume');svgBars('holdTrend',r,'holds','bar-hold');svgBars('wasfatyTrend',r,'wasfaty','bar-wasfaty');renderRankBars()},0);return`<div class="grid">${k('Index',pc(latest.index))}${k('Dispensing',pc(latest.disp))}${k('STAT ≤30',pc(latest.stat))}${k('Orders',nf(latest.orders))}<div class="kpi-dashboard full"><div class="viz-card full"><div class="viz-head"><div class="viz-title">Performance Trend</div><div class="viz-meta">Dispensing · STAT · Index <span class="selected-month-label">${month==='ALL'?'Full trend':'Selected '+new Date(month+'-01').toLocaleString('en',{month:'short',year:'2-digit'})}</span></div></div><div class="chart-host" id="perfTrend"></div><div class="legend"><span><i class="ld"></i>Dispensing</span><span><i class="ls"></i>STAT</span><span><i class="li"></i>Index</span></div></div><div class="viz-card"><div class="viz-head"><div class="viz-title">Dispensing Volume</div><div class="viz-meta">Orders</div></div><div class="chart-host" id="volumeTrend"></div></div><div class="viz-card"><div class="viz-head"><div class="viz-title">Hold Trend</div><div class="viz-meta">Monthly</div></div><div class="chart-host" id="holdTrend"></div></div><div class="viz-card"><div class="viz-head"><div class="viz-title">Wasfaty Trend</div><div class="viz-meta">Lower is better</div></div><div class="chart-host" id="wasfatyTrend"></div></div><div class="viz-card"><div class="viz-head"><div class="viz-title">Employee Performance</div><div class="viz-meta">All staff</div></div><div class="rankbars" id="staffRankBars"></div></div></div><div class="hidden-export-table">${table}</div></div>`}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function openEmp(key,h){let e=aggD(h).employees.find(x=>x.key===key),s=aggS(h).employees.find(x=>x.key===key);if(!e)return;let d=$('#drawer');d.innerHTML=`<div class="drawer-head"><div><div class="quiet">${h}</div><h2 style="margin:5px 0 0">${e.name}</h2></div><button class="close" onclick="closeD()">✕</button></div><div class="detail-kpis"><div class="dk"><span>Orders</span><b>${nf(e.orders)}</b></div><div class="dk"><span>Completion</span><b>${pc(e.completion)}</b></div><div class="dk"><span>Index</span><b>${e.performance_index.toFixed(1)}</b></div></div><div class="sectitle" style="margin:20px 0 8px">Pharmacy Distribution</div>${e.stores.map(x=>`<div class="splitrow"><strong>${x.store}</strong><span>${nf(x.orders)} · ${x.share.toFixed(1)}%</span></div>`).join('')}${s?`<div class="sectitle" style="margin:22px 0 8px">STAT</div><div class="splitrow"><strong>Compliance</strong><span>${pc(s.compliance)}</span></div><div class="splitrow"><strong>Orders</strong><span>${nf(s.orders)}</span></div><div class="splitrow"><strong>Median</strong><span>${s.median.toFixed(1)} min</span></div>`:''}`;d.classList.add('open')}function closeD(){$('#drawer').classList.remove('open')}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('#scope button').forEach(b=>b.classList.toggle('active',b.dataset.h===hospital));document.querySelectorAll('#months button').forEach(b=>b.classList.toggle('active',b.dataset.m===month));$('#app').innerHTML=({kpi,overview,staff,stat:statv,hold:holdv,wasfaty:wasfv}[tab])()}function exportX(){let id={kpi:'kpiTable',overview:'overviewTable',staff:'staffTable',stat:'statTable',hold:'holdTable',wasfaty:'wasfatyTable'}[tab],t=document.getElementById(id);if(!t)return;let b=new Blob([`<html><head><meta charset="utf-8"></head><body>${t.outerHTML}</body></html>`],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`pharmacy_${tab}_${hospital}_${month}.xls`;a.click()}
$('#nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;render()}};$('#scope').onclick=e=>{if(e.target.dataset.h){hospital=e.target.dataset.h;render()}};$('#search').oninput=e=>{query=e.target.value.trim();render()};$('#export').onclick=exportX;$('#months').innerHTML=`<button data-m="ALL" class="active">All</button>`+M.map(m=>`<button data-m="${m}">${new Date(m+'-01').toLocaleString('en',{month:'short',year:'2-digit'})}</button>`).join('');$('#months').onclick=e=>{if(e.target.dataset.m){month=e.target.dataset.m;render()}};
async function sha256hex(text){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const ACCESS_HASH='4bbd407fc66422c9babe3f67c11a9585f81342e5e908079e06d410d1b442d0ce';
function unlock(){document.body.classList.remove('locked');document.getElementById('loginGate').style.display='none';}
async function attemptLogin(){let p=document.getElementById('loginPassword').value;let x=await sha256hex(p);if(x===ACCESS_HASH){sessionStorage.setItem('pharmacy_access','1');unlock();}else{document.getElementById('loginError').textContent='Incorrect password';document.getElementById('loginPassword').select();}}
document.getElementById('loginBtn').addEventListener('click',attemptLogin);document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')attemptLogin()});if(sessionStorage.getItem('pharmacy_access')==='1')unlock();
const fr=document.getElementById('freshness');if(fr&&DATA.meta){fr.textContent='Last refresh · '+new Date(DATA.meta.last_refresh).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+' · Wasfaty daily · Operations monthly';}
render();
</script></body></html>
