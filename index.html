<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pharmacy Performance Intelligence</title>
<style>
:root{--bg:#07090d;--p:#10151c;--p2:#171d25;--line:#2b3440;--txt:#f5f0e7;--mut:#98a3ae;--gold:#d2ae68;--green:#6fc69a;--orange:#dda45a;--red:#dc7c7c;--cyan:#78b7c8}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0,#1b150c 0,#07090d 25%);color:var(--txt);font:14px Segoe UI,Arial,sans-serif}
header{position:sticky;top:0;z-index:30;background:#080a0ef2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:15px 19px}
.brand{display:flex;justify-content:space-between;gap:20px}.brand h1{margin:0;font-size:21px}.gold{color:var(--gold)}.muted{color:var(--mut)}
nav,.filters,.months,.subfilters,.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
button,select,input{background:var(--p);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px 11px}button{cursor:pointer}button.active,.month.active{border-color:var(--gold);color:var(--gold)}
button.primary{background:#211b10;border-color:#6a542a;color:#f4d99f}button.green{border-color:#315c49;color:#86d9ae}
main{max-width:1650px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{background:linear-gradient(180deg,#12171f,#0e1217);border:1px solid var(--line);border-radius:15px;padding:15px}.section{margin-top:13px}.kpi b{display:block;font-size:28px;margin:5px 0}
.table{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #202731;white-space:nowrap;text-align:left}th{position:sticky;top:0;background:#171d25;z-index:2}
.notice{background:#15130e;border:1px solid #4c3e22;border-left:3px solid var(--gold);padding:12px;border-radius:10px}.score{font-size:16px;font-weight:700}.good{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}
.badge{border:1px solid #34404d;border-radius:999px;padding:3px 8px;display:inline-block;margin:2px}.detail{white-space:normal;min-width:300px;color:var(--mut);font-size:12px;line-height:1.5}
.namebtn{background:none;border:0;padding:0;color:var(--txt);font-weight:600;text-decoration:underline;text-decoration-color:#d2ae6855;text-underline-offset:3px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.form label{display:flex;flex-direction:column;gap:5px}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chartcard{min-height:310px}.charttitle{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:8px}.charttitle h3{margin:0}
svg.chart{width:100%;height:255px;overflow:visible}.axis{stroke:#53606d;stroke-width:1}.gridline{stroke:#28313b;stroke-width:1}.label{fill:#9ba6b1;font-size:11px}.line{fill:none;stroke:#d2ae68;stroke-width:3}.dot{fill:#d2ae68}.barrect{fill:#d2ae68}.bar2{fill:#78b7c8}
#modal{display:none;position:fixed;inset:0;background:#000b;z-index:100;padding:3vh 3vw;overflow:auto}#modal.open{display:block}.modalbox{max-width:1350px;margin:auto;background:#0e1218;border:1px solid #3b4654;border-radius:18px;padding:18px;box-shadow:0 25px 80px #000}.modalhead{display:flex;justify-content:space-between;gap:15px}.close{font-size:20px}
.small{font-size:12px}.bigscore{font-size:36px;font-weight:800;color:var(--gold)}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.chartgrid,.split{grid-template-columns:1fr}.form{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.grid,.form{grid-template-columns:1fr}main{padding:10px}.hero{display:block}}

body.locked > header, body.locked > main, body.locked > #modal{filter:blur(8px);pointer-events:none;user-select:none}
.login-gate{display:none;position:fixed;inset:0;z-index:500;background:rgba(5,7,10,.96);align-items:center;justify-content:center;padding:20px}
body.locked .login-gate{display:flex}
.login-panel{width:min(420px,92vw);background:linear-gradient(180deg,#12171f,#0d1116);border:1px solid #3a4654;border-radius:18px;padding:28px;box-shadow:0 25px 80px #000;text-align:center}
.login-panel h2{margin:0 0 6px;font-size:24px}.login-panel p{color:var(--mut);margin:0 0 18px}
.login-panel input{width:100%;padding:12px 14px;margin-bottom:10px;text-align:center;font-size:16px}
.login-panel button{width:100%;padding:12px;border-color:var(--gold);color:var(--gold)}
.login-error{min-height:20px;margin-top:10px;color:var(--red);font-size:13px}

</style>
</head>
<body class="locked">
<div class="login-gate" id="loginGate">
  <div class="login-panel">
    <h2>Pharmacy Performance Intelligence</h2>
    <p>Authorized access only</p>
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn">Enter</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<header>
<div class="brand"><div><h1>Pharmacy Performance Intelligence</h1><div class="gold">Created by Automation Supervisor Ali Alsada</div></div></div>
<nav id="nav"></nav>
<div class="filters">
<button id="allPeriod">All Period</button><span id="months" class="months"></span>
<select id="hospital"><option value="ALL">Both Hospitals</option><option value="QCH">Qatif Central Hospital</option><option value="PMFH">Prince Mohammed Bin Fahd Hospital</option></select>
<select id="pharmacy"><option value="ALL">All Pharmacies</option></select>
<select id="track"><option value="ALL">All Employee Tracks</option><option>Regular Staff</option><option>Inventory</option><option>Clinical</option><option>Management</option></select>
<input id="search" placeholder="Search employee">
<button class="green" id="exportAllTop">Export All to Excel</button>
</div>
</header>
<main id="app">Loading…</main>
<div id="modal"><div class="modalbox"><div class="modalhead"><div id="modalTitle"></div><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const S={d:null,tab:'KPI',months:new Set(),hospital:'ALL',pharmacy:'ALL',track:'ALL',search:'',analyticsEmployee:null};
const tabs=['KPI','Final Performance','Employee Analytics','Employee Details','Dispensing','STAT','Patient Safety Hold','Clinical','Inventory','Wasfaty','Admin Evaluation'];


const $=q=>document.querySelector(q),nf=n=>Number(n||0).toLocaleString(),pc=n=>n==null?'—':Number(n).toFixed(1)+'%';
const stockFmt=n=>n==null?'<span class="muted">Not linked</span>':Number(n).toLocaleString();
const EMap=()=>new Map(S.d.employees.map(e=>[e.id,e])), selectedMonths=()=>S.months.size?S.months:new Set(S.d.months);

function visibleEmployee(e){return (S.hospital==='ALL'||e.home_hospital===S.hospital)&&(S.track==='ALL'||e.track===S.track)&&(!S.search||e.name.toUpperCase().includes(S.search.trim().toUpperCase()))}
function agg(track=null,monthsOverride=null){
 const E=EMap(),M=new Map,ms=monthsOverride||selectedMonths();
 for(const e of S.d.employees){if(!visibleEmployee(e)||(track&&e.track!==track))continue;M.set(e.id,{id:e.id,name:e.name,home:e.home_hospital,role:e.role,track:e.track,title:e.local_title,reports:e.reports_to,orders:0,disp:0,patients:0,stat:0,s30:0,holds:0,clin:0,reviews:0,inv:0,stores:new Map,acts:new Map})}
 for(const r of S.d.employee_monthly){if(!ms.has(r.month))continue;const e=E.get(r.employee_id);if(!e||!visibleEmployee(e)||(track&&e.track!==track))continue;const a=M.get(e.id);if(!a)continue;
  if(r.dispensing){a.orders+=r.dispensing.orders||0;a.disp+=r.dispensing.dispensed||0;a.patients+=r.dispensing.patients||0;(r.dispensing.pharmacy_mix||[]).forEach(x=>a.stores.set(x.store,(a.stores.get(x.store)||0)+(x.orders||0)));(r.dispensing.activity_hospitals||[]).forEach(x=>a.acts.set(x.hospital,(a.acts.get(x.hospital)||0)+(x.orders||0)))}
  if(r.stat){a.stat+=r.stat.orders||0;a.s30+=r.stat.within30||0}
  if(r.hold)a.holds+=r.hold.holds||0;
  if(r.clinical){a.clin+=r.clinical.interventions||0;a.reviews+=r.clinical.reviews||0}
  if(r.inventory)a.inv+=r.inventory.requests||0;
 }
 for(const a of M.values()){a.statc=a.stat?100*a.s30/a.stat:null;a.main=[...a.stores].sort((x,y)=>y[1]-x[1])[0]?.[0]||'—'}
 let out=[...M.values()];
 if(S.pharmacy!=='ALL')out=out.filter(a=>(a.stores.get(S.pharmacy)||0)>0);
 return out
}
function allOperationalPeers(monthsOverride=null){
 const saveT=S.track,saveQ=S.search;S.track='ALL';S.search='';const A=agg(null,monthsOverride);S.track=saveT;S.search=saveQ;return A;
}

function defaultKpiWeights(){
 return {
   regular_management:{dispensing:40,hold:30,stat:30},
   clinical:{clinical:100},
   inventory:{inventory:100}
 }
}
function getKpiWeights(){
 try{
   const saved=JSON.parse(localStorage.getItem('ppi_kpi_weights_v11')||'null');
   const d=defaultKpiWeights();
   if(!saved)return d;
   return {
     regular_management:{
       dispensing:Number(saved.regular_management?.dispensing ?? d.regular_management.dispensing),
       hold:Number(saved.regular_management?.hold ?? d.regular_management.hold),
       stat:Number(saved.regular_management?.stat ?? d.regular_management.stat)
     },
     clinical:{clinical:Number(saved.clinical?.clinical ?? d.clinical.clinical)},
     inventory:{inventory:Number(saved.inventory?.inventory ?? d.inventory.inventory)}
   }
 }catch(e){return defaultKpiWeights()}
}
function saveKpiWeights(w){localStorage.setItem('ppi_kpi_weights_v11',JSON.stringify(w))}
function resetKpiWeights(){localStorage.removeItem('ppi_kpi_weights_v11')}

function manuals(){return JSON.parse(localStorage.getItem('ppi_v5_manual')||'[]')}
function manualPack(eid,cat,monthsOverride=null){const ms=monthsOverride||selectedMonths(),x=manuals().filter(a=>a.employee_id===eid&&ms.has(a.month)&&a.category===cat),w=x.reduce((s,a)=>s+Number(a.weight||0),0),score=w?x.reduce((s,a)=>s+(Number(a.score||0)/5)*100*Number(a.weight||0),0)/w:null;return{weight:Math.min(w,100),score,items:x}}

function pharmacyWorkload(a,peers){
 if(!a.orders)return {score:null,details:[]};
 const total=[...a.stores.values()].reduce((s,v)=>s+v,0); if(!total)return {score:null,details:[]};
 let details=[];
 for(const [store,orders] of a.stores){
   let top=0,topName='';
   for(const p of peers.filter(x=>x.home===a.home&&(x.track==='Regular Staff'||x.track==='Management'))){
     const v=p.stores.get(store)||0;if(v>top){top=v;topName=p.name}
   }
   const score=top?100*orders/top:null, share=100*orders/total;
   details.push({store,orders,top,topName,score,share,weighted:score==null?0:score*share/100});
 }
 const score=details.reduce((s,x)=>s+x.weighted,0);
 return {score,details:details.sort((x,y)=>y.orders-x.orders)};
}
function maxIn(peers,field,track,home){const v=peers.filter(x=>(!track||x.track===track)&&x.home===home).map(x=>x[field]||0);return v.length?Math.max(...v):0}

function opScore(a,peers,monthsOverride=null){
 let c=[];
 if(a.track==='Clinical'){
   const mx=maxIn(peers,'clin','Clinical',a.home);
   if(a.clin>0&&mx>0){const kw=getKpiWeights();c.push({n:'Clinical Interventions',w:kw.clinical.clinical,s:100*a.clin/mx,raw:`${nf(a.clin)} / ${nf(mx)}`});}
 }else if(a.track==='Inventory'){
   const mx=maxIn(peers,'inv','Inventory',a.home);
   if(a.inv>0&&mx>0){const kw=getKpiWeights();c.push({n:'Inventory Requests',w:kw.inventory.inventory,s:100*a.inv/mx,raw:`${nf(a.inv)} / ${nf(mx)}`});}
 }else{
   const w=pharmacyWorkload(a,peers);
   const kw=getKpiWeights();if(w.score!=null)c.push({n:'Dispensing Workload',w:kw.regular_management.dispensing,s:w.score,raw:`Weighted across ${w.details.length} pharmacy location(s)`,workload:w});
   const group=peers.filter(x=>x.home===a.home&&(x.track==='Regular Staff'||x.track==='Management'));
   const maxHold=Math.max(0,...group.map(x=>x.holds||0));
   if(maxHold>0)c.push({n:'Patient Safety Hold',w:kw.regular_management.hold,s:100*(a.holds||0)/maxHold,raw:`${nf(a.holds)} / ${nf(maxHold)}`});
   if(a.stat>=S.d.config.stat_min_orders)c.push({n:'STAT ≤30 min',w:kw.regular_management.stat,s:a.statc,raw:`${nf(a.s30)} / ${nf(a.stat)}`});
 }
 const m=manualPack(a.id,'Operational',monthsOverride),avail=c.filter(x=>x.s!=null),bw=avail.reduce((s,x)=>s+x.w,0),auto=bw?avail.reduce((s,x)=>s+x.s*x.w,0)/bw:null,autoW=Math.max(0,100-m.weight);
 let score=null;if(auto!=null&&m.score!=null)score=auto*autoW/100+m.score*m.weight/100;else if(auto!=null)score=auto;else if(m.score!=null)score=m.score;
 return{score,auto,components:c,manual:m,autoW}
}
function finalScore(a,peers,monthsOverride=null){
 if(a.role==='Director')return{op:{score:null,components:[],manual:{weight:0,score:null}},ad:{score:null},rw:{operational:0,administrative:0},final:null,status:'Director — not evaluated',opContribution:null,opTarget:0};
 const op=opScore(a,peers,monthsOverride),rw=S.d.config.role_weights[a.role]||{operational:100,administrative:0},ad=manualPack(a.id,'Administrative',monthsOverride);
 let final=null,status='Complete';
 if(op.score==null)status='Operational evaluation pending';
 else if(rw.administrative>0&&ad.score==null)status='Administrative evaluation pending';
 else final=op.score*rw.operational/100+(ad.score||0)*rw.administrative/100;
 return{op,ad,rw,final,status,opContribution:op.score==null?null:op.score*rw.operational/100,opTarget:rw.operational}
}
function card(t,v,s=''){return`<div class="card kpi"><span class="muted">${t}</span><b>${v}</b><small class="muted">${s}</small></div>`}
function tbl(h,r){return`<div class="table"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.join('')}</tbody></table></div>`}
function nb(a){return`<button class="namebtn" onclick="showEmployee('${a.id}')">${a.name}</button>`}
function roleTargetText(f){return `${f.opContribution==null?'—':f.opContribution.toFixed(1)} / ${f.opTarget}`}

function simpleBarChart(rows, labelKey, valueKey, suffix=''){
 if(!rows.length)return '<div class="muted">No data</div>';
 const W=760,H=250,L=145,R=30,T=15,B=35,max=Math.max(1,...rows.map(x=>Number(x[valueKey]||0))),barH=Math.max(14,(H-T-B)/rows.length*.65),gap=(H-T-B)/rows.length;
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
 for(let i=0;i<rows.length;i++){const y=T+i*gap+gap*.18,w=(W-L-R)*Number(rows[i][valueKey]||0)/max;s+=`<text class="label" x="${L-8}" y="${y+barH*.75}" text-anchor="end">${escapeHtml(String(rows[i][labelKey]).slice(0,24))}</text><rect class="barrect" x="${L}" y="${y}" width="${Math.max(1,w)}" height="${barH}" rx="4"></rect><text class="label" x="${L+w+6}" y="${y+barH*.75}">${Number(rows[i][valueKey]||0).toFixed(1)}${suffix}</text>`}
 return s+'</svg>';
}
function lineChart(rows,labelKey,valueKey,suffix=''){
 if(!rows.length)return '<div class="muted">No data</div>';
 const W=760,H=250,L=48,R=24,T=20,B=38,max=Math.max(1,...rows.map(x=>Number(x[valueKey]||0))),min=0,px=i=>L+(W-L-R)*(rows.length===1?.5:i/(rows.length-1)),py=v=>T+(H-T-B)*(1-(v-min)/(max-min||1));
 let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
 for(let k=0;k<=4;k++){const y=T+(H-T-B)*k/4,val=max*(1-k/4);s+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"></line><text class="label" x="${L-6}" y="${y+4}" text-anchor="end">${val.toFixed(0)}${suffix}</text>`}
 const pts=rows.map((x,i)=>`${px(i)},${py(Number(x[valueKey]||0))}`).join(' ');
 s+=`<polyline class="line" points="${pts}"></polyline>`;
 rows.forEach((x,i)=>{s+=`<circle class="dot" cx="${px(i)}" cy="${py(Number(x[valueKey]||0))}" r="4"></circle><text class="label" x="${px(i)}" y="${H-12}" text-anchor="middle">${escapeHtml(String(x[labelKey]).replace('2026-',''))}</text>`});
 return s+'</svg>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function KPI(){
 const A=agg(),P=A.map(a=>({a,f:finalScore(a,A)}));
 return`<div class="grid">${card('Employees',A.length)}${card('Dispensing Orders',nf(A.reduce((s,a)=>s+a.orders,0)))}${card('Patient Safety Holds',nf(A.reduce((s,a)=>s+a.holds,0)))}${card('STAT Compliance',pc((()=>{let t=A.reduce((s,a)=>s+a.stat,0),w=A.reduce((s,a)=>s+a.s30,0);return t?100*w/t:null})()))}${card('Clinical Interventions',nf(A.reduce((s,a)=>s+a.clin,0)))}${card('Inventory Requests',nf(A.reduce((s,a)=>s+a.inv,0)))}${card('Completed Final Scores',P.filter(x=>x.a.role!=='Director'&&x.f.final!=null).length)}${card('Pending Scores',P.filter(x=>x.a.role!=='Director'&&x.f.final==null).length)}</div>
 <div class="card section"><div class="hero"><div><h3>Employee KPI Snapshot</h3><p class="muted">Click any employee to open the full KPI card.</p></div><button class="green" onclick="exportAllExcel()">Export Current View to Excel</button></div>${tbl(['Employee','Hospital','Role / Track','Main Pharmacy','Dispensing','Hold','STAT','Clinical','Inventory','Operational'],A.map(a=>{const f=finalScore(a,A);return`<tr><td>${nb(a)}</td><td>${a.home}</td><td>${a.role} / ${a.track}</td><td>${a.main}</td><td>${nf(a.orders)}</td><td>${nf(a.holds)}</td><td>${pc(a.statc)}</td><td>${nf(a.clin)}</td><td>${nf(a.inv)}</td><td class="score">${pc(f.op.score)}</td></tr>`}))}</div>`
}
function FinalPerformance(){
 const A=agg(),R=A.filter(a=>a.role!=='Director').map(a=>({a,f:finalScore(a,A)})).sort((x,y)=>(y.f.final??y.f.opContribution??-1)-(x.f.final??x.f.opContribution??-1));
 return`<div class="notice"><b>Final evaluation logic</b><br>Dispensing is calculated separately in every pharmacy where the employee worked. In each pharmacy: employee orders ÷ highest employee orders in the same hospital and same pharmacy. Those pharmacy scores are then weighted by the employee's own workload share in each pharmacy. Zero dispensing = N/A, no penalty. Patient Safety Hold = employee Hold count ÷ highest Hold count in the same hospital. STAT = % completed within 30 minutes (minimum 10 orders). Clinical = interventions only. Inventory = requests only. Missing components are excluded and weights are redistributed.</div>
 <div class="card section">${tbl(['Employee','Hospital','Role / Track','Operational Score','Operational Contribution / Target','Administrative','Final','Status / Calculation'],R.map(({a,f})=>`<tr><td>${nb(a)}</td><td>${a.home}</td><td>${a.role} / ${a.track}</td><td class="score">${pc(f.op.score)}</td><td><b>${roleTargetText(f)}</b></td><td>${pc(f.ad.score)}</td><td class="score">${pc(f.final)}</td><td class="detail">${f.status}<br>${f.op.components.map(c=>`${c.n}: ${pc(c.s)} (${c.raw})`).join(' • ')||'No automatic comparable KPI'}</td></tr>`))}</div>`
}
function EmployeeAnalytics(){
 let E=S.d.employees.filter(visibleEmployee); if(!E.length)return '<div class="notice">No employees match the current filter.</div>';
 let id=S.analyticsEmployee&&E.some(e=>e.id===S.analyticsEmployee)?S.analyticsEmployee:E[0].id;S.analyticsEmployee=id;
 return`<div class="card"><div class="hero"><div><h2 style="margin:0">Employee Analytics</h2><div class="muted">Select an employee to view KPI trends, pharmacy workload, and export the complete card.</div></div><div class="actions"><select id="analyticsEmp">${E.map(e=>`<option value="${e.id}" ${e.id===id?'selected':''}>${e.name} — ${e.home_hospital} — ${e.role}/${e.track}</option>`).join('')}</select><button class="primary" onclick="exportEmployeeExcel('${id}')">Export Employee to Excel</button></div></div></div><div id="analyticsBody"></div>`
}
function renderAnalyticsBody(id){
 const A=agg(),a=A.find(x=>x.id===id);if(!a){$('#analyticsBody').innerHTML='<div class="notice">Employee is outside current filters.</div>';return}
 const f=finalScore(a,A),w=pharmacyWorkload(a,A),monthly=[];
 for(const m of S.d.months.filter(m=>selectedMonths().has(m))){
   const ms=new Set([m]),peers=allOperationalPeers(ms),ma=peers.find(x=>x.id===id);
   if(!ma)continue;const mf=finalScore(ma,peers,ms);
   monthly.push({month:m,operational:mf.op.score||0,orders:ma.orders,holds:ma.holds,stat:ma.statc||0,clinical:ma.clin,inventory:ma.inv});
 }
 const comp=f.op.components.map(c=>({name:c.n,score:c.s||0}));
 $('#analyticsBody').innerHTML=`<div class="grid section">${card('Final Performance',pc(f.final),f.status)}${card('Operational Score',pc(f.op.score),`Contribution ${roleTargetText(f)}`)}${card('Weighted Workload',pc(w.score),`${w.details.length} pharmacy location(s)`)}${card('Patient Safety Hold',nf(a.holds))}${card('STAT Compliance',pc(a.statc),`${nf(a.stat)} STAT orders`)}${card('Clinical Interventions',nf(a.clin))}${card('Inventory Requests',nf(a.inv))}${card('Patients',nf(a.patients))}</div>
 <div class="chartgrid section">
  <div class="card chartcard"><div class="charttitle"><h3>Monthly Operational Trend</h3><span class="muted">Selected period</span></div>${lineChart(monthly,'month','operational','%')}</div>
  <div class="card chartcard"><div class="charttitle"><h3>KPI Component Scores</h3><span class="muted">Current selection</span></div>${simpleBarChart(comp,'name','score','%')}</div>
  <div class="card chartcard"><div class="charttitle"><h3>Pharmacy Workload Score</h3><span class="muted">Each location vs its top performer</span></div>${simpleBarChart(w.details.map(x=>({store:x.store,score:x.score||0})),'store','score','%')}</div>

function xmlEscape(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function excelCell(v){
 const n=Number(v);const numeric=(typeof v==='number'||(v!==''&&v!==null&&Number.isFinite(n)&&String(v).trim()!==''));return `<Cell><Data ss:Type="${numeric?'Number':'String'}">${xmlEscape(numeric?n:v)}</Data></Cell>`
}
function downloadExcel(filename,sheets){
 let xml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Header"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#6B572F" ss:Pattern="Solid"/></Style></Styles>`;
 for(const sh of sheets){xml+=`<Worksheet ss:Name="${xmlEscape(sh.name.slice(0,31))}"><Table>`;sh.rows.forEach((row,ri)=>{xml+=`<Row>${row.map(v=>ri===0?`<Cell ss:StyleID="Header"><Data ss:Type="String">${xmlEscape(v)}</Data></Cell>`:excelCell(v)).join('')}</Row>`});xml+=`</Table></Worksheet>`}
 xml+='</Workbook>';const blob=new Blob([xml],{type:'application/vnd.ms-excel'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename.endsWith('.xls')?filename:filename+'.xls';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)
}

function storeHospital(store){
 if(/^PMFH/i.test(store)||store==='PharmacyWasfatStore')return 'PMFH';
 return 'QCH'
}
function updatePharmacyOptions(){
 const sel=$('#pharmacy');if(!sel)return;
 const stores=new Set();
 for(const r of S.d.employee_monthly){
   if(!selectedMonths().has(r.month)||!r.dispensing)continue;
   for(const x of (r.dispensing.pharmacy_mix||[])){
     if(S.hospital==='ALL'||storeHospital(x.store)===S.hospital)stores.add(x.store)
   }
 }
 const old=S.pharmacy;
 const arr=[...stores].sort((a,b)=>a.localeCompare(b));
 sel.innerHTML='<option value="ALL">All Pharmacies</option>'+arr.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(x)}</option>`).join('');
 if(old!=='ALL'&&arr.includes(old)){sel.value=old}else{S.pharmacy='ALL';sel.value='ALL'}
}


function applyInventoryDb(db){
 if(!db||!Array.isArray(db.items))return false;
 const M=new Map(db.items.map(it=>[String(it.generic||'').trim(),{lc:Number(it.lc_qty||0),mosool:Number(it.mosool_qty||0)}]));
 let n=0;
 for(const x of (S.d.wasfaty?.drugs||[])){
   const code=String(x.nupco_code||'').trim();if(!code)continue;
   const v=M.get(code);
   if(v){x.lc_qty=v.lc;x.mosool_qty=v.mosool;n++}
   else{x.lc_qty=0;x.mosool_qty=0}
 }
 return n>0
}
function loadLiveInventory(){
 return new Promise(resolve=>{
   const old=window.DASHBOARD_DB;
   const sc=document.createElement('script');
   sc.src='https://alizakialsada.github.io/QCH-DASBOARD/dashboard-data.js?v='+Date.now();
   sc.async=true;
   sc.onload=()=>{const ok=applyInventoryDb(window.DASHBOARD_DB);if(old!==undefined)window.DASHBOARD_DB=old;else try{delete window.DASHBOARD_DB}catch(e){};if(ok&&S.tab==='Wasfaty')render();resolve(ok)};
   sc.onerror=()=>resolve(false);
   document.head.appendChild(sc)
 })
}

 };
 if(rw)rw.onclick=()=>{resetKpiWeights();alert('KPI weights reset to default.');render()};
 if($('#madd'))$('#madd').onclick=()=>{const a=manuals();a.push({employee_id:$('#me').value,month:$('#mm').value,category:$('#mc').value,criterion:$('#mn').value||'Manual Criterion',weight:Number($('#mw').value)||0,score:Number($('#ms').value)||0,evaluator:$('#mv').value,notes:$('#mnotes').value});localStorage.setItem('ppi_v5_manual',JSON.stringify(a));render()};
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=manuals();a.splice(Number(b.dataset.del),1);localStorage.setItem('ppi_v5_manual',JSON.stringify(a));render()})
}
}

async function pageSha256(text){
 const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
 return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')
}
const PAGE_ACCESS_HASH='81e2948648dc2471336646a3dd628ade279b8125a87259276e198c441b30de43';
function unlockPage(){
 document.body.classList.remove('locked');
 const g=document.getElementById('loginGate');if(g)g.style.display='none'
}
async function attemptPageLogin(){
 const p=document.getElementById('loginPassword').value;
 const h=await pageSha256(p);
 if(h===PAGE_ACCESS_HASH){
   sessionStorage.setItem('ppi_page_access','1');
   unlockPage()
 }else{
   document.getElementById('loginError').textContent='Incorrect password';
   document.getElementById('loginPassword').select()
 }
}

function setup(){
 const lb=document.getElementById('loginBtn'),lp=document.getElementById('loginPassword');
 if(lb)lb.onclick=attemptPageLogin;
 if(lp)lp.onkeydown=e=>{if(e.key==='Enter')attemptPageLogin()};
 if(sessionStorage.getItem('ppi_page_access')==='1')unlockPage();
 S.months=new Set(S.d.months);
 $('#nav').innerHTML=tabs.map(t=>`<button data-t="${t}">${t}</button>`).join('');
 $('#nav').onclick=e=>{if(e.target.dataset.t){S.tab=e.target.dataset.t;render()}};
 $('#months').innerHTML=S.d.months.map(m=>`<button class="month active" data-m="${m}">${new Date(m+'-01').toLocaleString('en',{month:'short',year:'2-digit'})}</button>`).join('');
 $('#months').onclick=e=>{const m=e.target.dataset.m;if(!m)return;S.months.has(m)?S.months.delete(m):S.months.add(m);e.target.classList.toggle('active');updatePharmacyOptions();render()};
 $('#allPeriod').onclick=()=>{S.months=new Set(S.d.months);document.querySelectorAll('.month').forEach(x=>x.classList.add('active'));updatePharmacyOptions();render()};
 $('#hospital').onchange=e=>{S.hospital=e.target.value;S.pharmacy='ALL';S.analyticsEmployee=null;updatePharmacyOptions();render()};
 $('#pharmacy').onchange=e=>{S.pharmacy=e.target.value;S.analyticsEmployee=null;render()};
 $('#track').onchange=e=>{S.track=e.target.value;S.analyticsEmployee=null;render()};
 let t;$('#search').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{S.search=e.target.value;S.analyticsEmployee=null;render()},100)};
 $('#exportAllTop').onclick=exportAllExcel;updatePharmacyOptions();render();loadLiveInventory()
}
fetch('data/platform-data.json').then(r=>r.json()).then(d=>{S.d=d;setup()}).catch(()=>$('#app').innerHTML='Open preview.html or host this folder through GitHub Pages.')
</script>
